[project]
name = "sidewalks"
version = "0.1.0"
description = "Accessible pedestrian routing over OpenStreetMap sidewalk data"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
# Tools for development and CI only: pip install -e ".[dev]"
dev = [
    "pytest>=8.3",
    "httpx>=0.27",   # FastAPI's TestClient uses it
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/F: errors, I: import order, UP: modern Python syntax, B: common bugs
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true   # every function needs type hints
